# Minimal OpenAPI spec for the api plugin's import round-trip in the host
# leg. Deliberately local and offline: `api import` ingests it, `api list`
# shows it, `api remove` reclaims it — no network, no credentials.
openapi: 3.0.0
info:
  title: e2e-petstore
  version: 1.0.0
servers:
  - url: http://localhost:1/v1
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      responses:
        '200':
          description: A list of pets
