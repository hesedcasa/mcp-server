name: Run end-to-end tests

permissions:
  contents: read

# Two legs per run: the standalone CLI (stdio + Streamable HTTP, fully
# offline) and the sdkck host leg, where this build is packed, installed as
# the host's @hesed/mcp-server plugin alongside every other @hesed plugin
# from the registry, and run_command executes their real commands — live
# sandbox reads for jira/conni/bb/sentry/trello, throwaway Docker servers for
# mysql/psql (docker is preinstalled on the runner).
#
# On demand from the default branch only: fork PRs cannot get the OIDC token
# they need for the sandbox credentials, and the default-branch gate keeps a
# manual dispatch of an untrusted ref from running repository code with them.
#
# The sandbox credentials come from the Infisical project in .infisical.json
# (`dev` environment), fetched over GitHub OIDC. Blocked until the repository
# variables INFISICAL_IDENTITY_ID and INFISICAL_PROJECT_SLUG are set and the
# machine identity's OIDC auth allows this repo.
on:
  workflow_dispatch:

concurrency:
  group: mcp-server-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that installs or builds runs here, with no OIDC permission: a
  # compromised `npm ci`, sdkck or plugin-install lifecycle script can neither
  # read the sandbox credentials nor request a token to fetch them itself.
  build:
    name: Build the CLI and install the sdkck host
    # The test job needs this one, so it is skipped with it.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # Pinned to a full SHA: these actions run before repository code gets
        # the credentials, so a moved mutable tag could swap what executes.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
          # Nothing here pushes, and the default would leave GITHUB_TOKEN in
          # the workspace git config for every later step to reuse.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci
        env:
          # The suite never opens a browser; skipping the download keeps the
          # install fast.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Builds the CLI, installs the latest sdkck, then packs this build and
      # installs it plus @hesed/<plugin>@latest from npm into the sdkck home
      # the test job reuses — the install half of `npm run test:e2e`.
      - name: Build the CLI and install sdkck and the plugins
        run: npm run test:e2e -- --setup-only
        env:
          E2E_PLUGIN_SOURCE: npm
          E2E_SDKCK_HOME: ${{ runner.temp }}/sdkck-home

      # Only the build outputs travel: the job that holds the credentials
      # checks out the repository itself, so a lifecycle script that edits or
      # adds a source, test or script file here cannot get it run there.
      # node_modules and the installed plugins are still installed code — the
      # tests cannot run without them — so this narrows, not removes, that
      # trust. A tarball rather than the artifact's own zip, which drops
      # executable bits and node_modules/.bin symlinks. Absolute paths are kept
      # because the plugin install records them, and hosted runners share one
      # layout.
      - name: Pack the build outputs and sdkck home
        run: |
          tar -czf "$RUNNER_TEMP/e2e-workspace.tgz" -C / \
            "${GITHUB_WORKSPACE#/}/node_modules" "${GITHUB_WORKSPACE#/}/dist" \
            "${RUNNER_TEMP#/}/sdkck-home"

      - name: Upload the workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-workspace
          path: ${{ runner.temp }}/e2e-workspace.tgz
          retention-days: 1

  run-e2e-tests:
    name: End-to-end tests (standalone + sdkck host)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token lets the Infisical action exchange GitHub's OIDC token for the
    # sandbox credentials, so no Infisical secret is stored in the repo. Only
    # this job has it, and nothing in it installs packages.
    permissions:
      contents: read
      id-token: write
    steps:
      # A fresh checkout of the dispatched commit, not the build job's copy:
      # see "Pack the build outputs and sdkck home".
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download the build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-workspace
          path: ${{ runner.temp }}

      # Extracts only the named members, so nothing else in the archive can
      # land over the checkout.
      - name: Unpack the build outputs and sdkck home
        run: |
          tar -xzf "$RUNNER_TEMP/e2e-workspace.tgz" -C / \
            "${GITHUB_WORKSPACE#/}/node_modules" "${GITHUB_WORKSPACE#/}/dist" \
            "${RUNNER_TEMP#/}/sdkck-home"
          echo "E2E_SDKCK_HOME=$RUNNER_TEMP/sdkck-home" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      # The Infisical action exports the sandbox credentials to $GITHUB_ENV,
      # so every later step sees them; the steps before it never do.
      - name: Fetch sandbox credentials from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: dev

      # Runs the standalone leg, starts the mysql/psql containers (built from
      # the vendored Dockerfiles, which run no install steps), runs the host
      # leg, and tears the containers down. A step-level timeout, so a hung
      # run still fails with the report upload run; the job-level timeout
      # stays as the outer backstop.
      - name: Run end-to-end tests
        timeout-minutes: 20
        run: npm run test:e2e -- --skip-setup
        env:
          E2E_PLUGIN_SOURCE: npm

      - name: Upload the Playwright report (with result screenshots)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
