name: Run end-to-end tests

permissions: read-all

# Two legs per run: the standalone CLI (stdio + Streamable HTTP, fully
# offline) and the sdkck host leg, where this build is packed, installed as
# the host's @hesed/mcp-server plugin alongside every other @hesed plugin
# from the registry, and run_command executes their real commands. The
# credential-backed sandbox reads skip without secrets; the mysql/psql legs
# run against throwaway Docker servers (docker is preinstalled on the
# runner).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: mcp-server-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-e2e-tests:
    name: End-to-end tests (standalone + sdkck host)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
          # Nothing here pushes, and the default would leave GITHUB_TOKEN in
          # the workspace git config for every later step to reuse.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci
        env:
          # The suite never opens a browser; skipping the download keeps the
          # install fast and the job offline.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Both legs in one run: leg 1 (standalone) plus the host leg with the
      # plugins installed from the registry into a throwaway sdkck home.
      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          E2E_PLUGIN_SOURCE: npm

      - name: Upload the Playwright report (with result screenshots)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
